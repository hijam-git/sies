# ─────────────────────────────────────────────────────────────────────────────
# Traefik DYNAMIC configuration — production
#
# Loaded by the file provider (`--providers.file.directory=/dynamic` in
# docker-compose.prod.yml) and re-read on change: editing this file does NOT
# require restarting Traefik, which is the whole reason routing lives here and
# not in the static flags.
#
# Everything here is a *definition*. Nothing is applied until a router asks for
# it by name (`middlewares=secure-headers@file`), so an unused entry costs
# nothing and a renamed one breaks a route loudly at load time.
# ─────────────────────────────────────────────────────────────────────────────

http:
  middlewares:

    # Applied to every router in docker-compose.prod.yml.
    #
    # HSTS is one year with subdomains: once a browser has seen it, it will not
    # be talked down to plain HTTP even if DNS is hijacked. Only turn it on when
    # the certificate is genuinely working — a browser that has cached HSTS for
    # a domain whose TLS later breaks cannot be persuaded to connect at all.
    #
    # frameDeny is safe here because SIES is never embedded: it is a staff SPA
    # behind a login, and the only thing an <iframe> of it could ever be is a
    # clickjacking attempt against a logged-in clerk.
    #
    # CORS is NOT set here. Django owns it (django-cors-headers) and it reads
    # the allowed origins from CORS_ALLOWED_ORIGINS. Two layers emitting
    # Access-Control-* headers is how you get a duplicate-header CORS failure
    # that neither config file explains.
    secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "same-origin"
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()"
        customResponseHeaders:
          # Traefik advertises itself by default. Version numbers are free
          # reconnaissance; blank it.
          Server: ""
          X-Powered-By: ""

    # Compression for the SPA bundle and JSON list responses. Traefik skips
    # already-compressed types (images, PDFs) on its own, so this is safe to
    # apply globally.
    compression:
      compress: {}

    # Student photos, uploaded documents and fee receipts are private records
    # (docs/01 §8). If an intermediate proxy or a shared browser cached them,
    # the next person on that machine could read another family's papers.
    # Applied to the /media router only.
    private-no-store:
      headers:
        customResponseHeaders:
          Cache-Control: "private, no-store, no-cache, must-revalidate"
          Pragma: "no-cache"

    # Django's collected static and the SPA's hashed bundle are content-addressed
    # (the filename changes when the content does), so they can be cached hard.
    # NOT applied to /media, which is user data — see above.
    static-cache:
      headers:
        customResponseHeaders:
          Cache-Control: "public, max-age=31536000, immutable"

    # The last millisecond of a rolling restart.
    #
    # scripts/pull_and_deploy.sh recreates the backend container while Traefik
    # is still holding a connection slot for the dying one. Traefik learns it is
    # gone from the Docker event stream — fast, but not instantaneous — and in
    # that window it can pick a server that is no longer listening.
    #
    # This retry only fires when the TCP connection itself failed and NO
    # response byte was received, i.e. the request provably never reached
    # Django. That is why it is safe on a POST: a fee collection that reached
    # the application and failed there returns a real response and is never
    # retried, so this cannot double-issue a receipt.
    retry:
      retry:
        attempts: 3
        initialInterval: 100ms

    # Guards the Traefik dashboard. The user:hash pairs come from
    # TRAEFIK_DASHBOARD_AUTH in .env.production; this middleware is referenced
    # by the dashboard router defined on the traefik service in the compose
    # file, so the credentials never appear in a committed file.
    #
    # WHAT IS DELIBERATELY NOT IN THIS FILE
    #
    # 1. Dashboard basic auth. The credential hash comes from
    #    TRAEFIK_DASHBOARD_AUTH in .env.production, and this file is committed,
    #    so that middleware is declared as a Docker label on the traefik service
    #    in docker-compose.prod.yml instead — Compose interpolates label values,
    #    the file provider does not interpolate anything.
    #
    # 2. A rate limiter. CLAUDE.md §1 forbids rate limiting in SIES; adding one
    #    at the proxy would reintroduce it by the back door, and the first thing
    #    it would throttle is a teacher saving a 60-row attendance register.

tls:
  options:
    default:
      # TLS 1.2 floor. 1.0/1.1 are broken and the only clients that need them
      # are older than any phone a teacher in Bangladesh is carrying.
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
      curvePreferences:
        - CurveP521
        - CurveP384
      # sniStrict would reject any request whose SNI has no certificate, which
      # includes the ACME HTTP-01 self-check on a brand-new domain. Left off.
      sniStrict: false
